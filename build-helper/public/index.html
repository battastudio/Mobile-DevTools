<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Build Helper — Mobile DevTools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/kit/tailwind.js"></script>
<link rel="stylesheet" href="/kit/kit.css">
<style>
  /* Build-Helper-scoped polish (kept out of shared kit.css) */
  .bh-term{border:1px solid var(--edge);border-radius:14px;background:var(--sunken);font:12px/1.55 'JetBrains Mono',monospace;padding:12px;height:300px;overflow:auto;white-space:pre-wrap}
  .bh-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .bh-card{transition:border-color .15s,transform .05s}
  .bh-card:hover{border-color:var(--edge2)}
  .bh-art{cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
  .bh-art.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--panel))}
  /* Release pipeline stations/rail (source design) — kit.css lacks the sel/cur states */
  .pipeline{display:flex;align-items:center;gap:0}
  .station{display:inline-flex;align-items:center;gap:.5rem;flex:none;cursor:pointer;background:none;border:0;padding:.2rem .1rem;-webkit-appearance:none}
  .station .node{width:.62rem;height:.62rem;border-radius:999px;background:color-mix(in srgb,var(--stn) 14%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--stn) 40%,transparent);transition:transform .18s ease,box-shadow .22s ease,background .22s ease}
  .station:hover .node{transform:scale(1.28);box-shadow:inset 0 0 0 1.5px var(--stn)}
  .station.sel .node{background:var(--stn);box-shadow:0 0 0 4px color-mix(in srgb,var(--stn) 24%,transparent),0 0 14px color-mix(in srgb,var(--stn) 60%,transparent)}
  .station.cur .node{box-shadow:0 0 0 2px color-mix(in srgb,var(--stn) 55%,transparent);animation:stnPulse 2.4s ease-in-out infinite}
  .station.cur.sel .node{animation:none}
  @keyframes stnPulse{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--stn) 35%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--stn) 18%,transparent),0 0 10px color-mix(in srgb,var(--stn) 40%,transparent)}}
  .station .lbl{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);transition:color .2s}
  .station.sel .lbl,.station.cur .lbl{color:#fff}
  .rail{height:2px;width:1.4rem;background:linear-gradient(90deg,var(--edge2),var(--edge));border-radius:2px;flex:none;transition:background .25s}
  .rail.lit{background:linear-gradient(90deg,var(--a),var(--b))}
  table.health th{cursor:pointer;user-select:none}
  table.health tbody tr:hover{background:var(--hover,#171B22)}
  #tt{position:fixed;z-index:60;display:none;pointer-events:none;background:#0C0E12;border:1px solid var(--edge2);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--ink);box-shadow:0 12px 28px rgba(0,0,0,.6);max-width:240px}
</style>
</head>
<body class="text-slate-200 min-h-screen">
<div id="toasts" class="fixed top-4 right-4 z-[60] space-y-2 w-80"></div>
<div id="tt"></div>
<div id="cmdk" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 overflow-y-auto"></div>
<div id="app" class="max-w-6xl mx-auto px-5 py-6"></div>
<!-- Vue 3 global build (CDN) — zero-build, loaded like any other kit script -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/kit/kit-dom.js"></script>
<script src="/kit/kit-md-tour.js"></script>
<script src="/kit/kit-icons.js"></script>
<script src="/kit/kit-net-modal.js"></script>
<script src="/kit/kit-nav.js"></script>
<script src="/kit/kit-settings.js"></script>
<script src="/kit/kit-connectors.js"></script>
<script src="/kit/components.js"></script>
<!-- ordered UI modules: each attaches to window.* for the next -->
<script src="/js/state.js"></script>
<script src="/js/api.js"></script>
<script src="/js/bh-ui.js"></script>
<script src="/js/components.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/health-table.js"></script>
<script src="/js/views.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/build-form.js"></script>
<script src="/js/build-wire.js"></script>
<script src="/js/build-run.js"></script>
<script src="/js/history.js"></script>
<script src="/js/share-card.js"></script>
<script src="/js/share.js"></script>
<script src="/js/share-actions.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/app-setup.js"></script>
<script src="/js/app-setup-more.js"></script>
<script src="/js/project.js"></script>
<script src="/js/setup.js"></script>
<script src="/js/cmdk.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
