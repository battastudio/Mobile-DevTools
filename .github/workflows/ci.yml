name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  line-cap:
    name: 150-line cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce ≤150 lines per source file
        run: node scripts/check-lines.js
